# jovi-medusa-commerce-v1 — required checks (PR gate)
# Runs on PRs to main and on pushes to development.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- deterministic static checks (no DB) ----
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.0 --activate

      # C3-derived audited Runtime baseline. R6's original import hash is historical;
      # see governance/c4/C4_RUNTIME_CI_BASELINE_RECONCILIATION.md.
      - name: Validate audited source tree SHA (deterministic)
        run: |
          python3 governance/r6/ci/verify_source_tree.py audit-source \
            3101604bf10c9c6ed3c9b67a23e5ef77a6704472835ccfd536c2cc0b6b8e568a

      - name: Validate frozen and C4 governance sidecars
        run: |
          python3 governance/r6/ci/verify_sidecars.py evidence/r2r2-freeze
          python3 governance/r6/ci/verify_sidecars.py governance/c4

      - name: Verify tracked C2 synthetic fixture
        working-directory: audit-source/tests/fixtures/c2-synthetic-digital-pack
        run: sha256sum -c SHA256SUMS.txt

      - name: Install frozen deps
        working-directory: audit-source/backend/jovi-medusa-backend
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (deterministic)
        working-directory: audit-source/backend/jovi-medusa-backend
        run: pnpm --filter @dtc/backend exec tsc --noEmit

      - name: Secret scan
        run: |
          python3 governance/r6/ci/secret_scan.py . --exclude node_modules --exclude .git \
            --exclude '**/runtime-r2r2/**' --exclude audit-source/backend/jovi-medusa-backend/pnpm-lock.yaml

      # The unit specs already accept JOVI_C2_FIXTURE_ROOT. Point them at the
      # tracked frozen fixture instead of relying on local-machine path layout.
      - name: Unit tests — natural shutdown, no --forceExit
        working-directory: audit-source/backend/jovi-medusa-backend/apps/backend
        env:
          JOVI_C2_FIXTURE_ROOT: ${{ github.workspace }}/audit-source/tests/fixtures/c2-synthetic-digital-pack
        run: |
          TEST_TYPE=unit NODE_OPTIONS=--experimental-vm-modules corepack pnpm exec jest --silent --runInBand

      - name: License / SBOM check
        run: python3 governance/r6/ci/license_check.py

  # ---- DB-backed integration + complete C2/X2 synthetic regression ----
  integration:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Run isolated C4 Runtime regression harness
        run: bash governance/c4/ci/regression.sh
